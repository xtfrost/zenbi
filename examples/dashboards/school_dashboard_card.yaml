# Dashboard Example: School Overview Dashboard Cards
#
# Copy and paste these cards into your Home Assistant Lovelace dashboard.
# If you have multiple children, replace entities with your child's entity IDs
# (e.g. 'calendar.zenbi_<student>_schedule', 'todo.zenbi_<student>_homework', etc.).

type: vertical-stack
cards:
  # ---------------------------------------------------------------------------
  # Card 1: Today's & Tomorrow's Class Schedule (Hidden when no classes)
  # ---------------------------------------------------------------------------
  - type: conditional
    conditions:
      - entity: calendar.zenbi_schedule
        state_not: "unavailable"
    card:
      type: markdown
      title: "🎒 Skoleskema"
      content: >-
        {% set classes_today = state_attr('calendar.zenbi_schedule', 'classes_today') | int(0) %}
        {% set agenda_today = state_attr('calendar.zenbi_schedule', 'agenda_today') %}
        {% set classes_tomorrow = state_attr('calendar.zenbi_schedule', 'classes_tomorrow') | int(0) %}
        {% set agenda_tomorrow = state_attr('calendar.zenbi_schedule', 'agenda_tomorrow') %}

        ### 📅 I dag ({{ classes_today }} lektioner)
        {% if classes_today > 0 and agenda_today %}
        | Tid | Fag | Lokale | Note |
        | :--- | :--- | :--- | :--- |
        {% for c in agenda_today -%}
        | **{{ c.time }}** | {{ c.title }} | {{ c.location or '-' }} | {% if c.has_homework %}📝 **Lektier!**{% elif c.substitutes %}⚠️ Vikar{% else %}-{% endif %} |
        {% endfor %}
        {% else %}
        *Ingen lektioner i dag (weekend eller ferie).*
        {% endif %}

        ---

        ### 📆 I morgen ({{ classes_tomorrow }} lektioner)
        {% if classes_tomorrow > 0 and agenda_tomorrow %}
        | Tid | Fag | Lokale | Note |
        | :--- | :--- | :--- | :--- |
        {% for c in agenda_tomorrow -%}
        | **{{ c.time }}** | {{ c.title }} | {{ c.location or '-' }} | {% if c.has_homework %}📝 **Lektier!**{% elif c.substitutes %}⚠️ Vikar{% else %}-{% endif %} |
        {% endfor %}
        {% else %}
        *Ingen lektioner i morgen.*
        {% endif %}

  # ---------------------------------------------------------------------------
  # Card 2: Ugeplan for denne uge (sensor.zenbi_weekly_plan)
  # ---------------------------------------------------------------------------
  - type: markdown
    title: >-
      📋 Ugeplan ({{ state_attr('sensor.zenbi_weekly_plan', 'title') or 'Denne uge' }})
    content: >-
      {% set plan = state_attr('sensor.zenbi_weekly_plan', 'content') %}
      {{ plan if plan else '_Ingen ugeplan fundet for denne uge._' }}

  # ---------------------------------------------------------------------------
  # Card 3: Næste uges ugeplan (Vises kun automatisk når læreren har lagt den op!)
  # ---------------------------------------------------------------------------
  - type: conditional
    conditions:
      - entity: sensor.zenbi_next_weekly_plan
        state_not: "0"
    card:
      type: markdown
      title: >-
        🔮 Næste uge: {{ state_attr('sensor.zenbi_next_weekly_plan', 'title') or 'Ugeplan' }}
      content: >-
        {{ state_attr('sensor.zenbi_next_weekly_plan', 'content') }}

  # ---------------------------------------------------------------------------
  # Card 4: Lektieliste (Native Todo List Card with completion checkboxes)
  # ---------------------------------------------------------------------------
  - type: todo-list
    entity: todo.zenbi_homework
    title: "📝 Lektier"
