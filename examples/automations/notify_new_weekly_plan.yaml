# Automation Example: Notify when next week's plan or a new weekly plan message is posted
#
# Triggers immediately when:
# 1. Next week's plan is posted (sensor.zenbi_next_weekly_plan changes from 0 to > 0).
# 2. Or this week's plan receives a new message/update.
# If you have multiple children, replace with 'sensor.zenbi_<student>_next_weekly_plan'.

alias: "Zenbi: Notify when New Weekly Plan is Posted"
description: "Send a notification when the teacher posts next week's plan or updates this week's plan."
trigger:
  # Trigger 1: Teacher publishes next week's plan (state goes from 0 to 1+)
  - platform: numeric_state
    entity_id: sensor.zenbi_next_weekly_plan
    above: 0
    id: next_week_published
  # Trigger 2: A new message or update is posted for the current week
  - platform: state
    entity_id: sensor.zenbi_weekly_plan
    id: current_week_updated
condition:
  # Avoid firing if current week goes to 0 or unavailable
  - condition: template
    value_template: >-
      {{ trigger.id == 'next_week_published' or
         (trigger.id == 'current_week_updated' and
          trigger.to_state is not none and
          trigger.from_state is not none and
          trigger.to_state.state | int(0) > trigger.from_state.state | int(0)) }}
action:
  - action: notify.notify
    data:
      title: >-
        {% if trigger.id == 'next_week_published' %}
          Zenbi: Ny ugeplan for næste uge ({{ state_attr('sensor.zenbi_next_weekly_plan', 'title') or 'Næste uge' }})
        {% else %}
          Zenbi: Ny besked i denne uges ugeplan ({{ state_attr('sensor.zenbi_weekly_plan', 'title') or 'Denne uge' }})
        {% endif %}
      message: >-
        {% if trigger.id == 'next_week_published' %}
          {{ (state_attr('sensor.zenbi_next_weekly_plan', 'content') or '') | truncate(350, True, '...') }}
        {% else %}
          {{ (state_attr('sensor.zenbi_weekly_plan', 'content') or '') | truncate(350, True, '...') }}
        {% endif %}
      data:
        tag: "zenbi-weekly-plan"
        url: "/lovelace/skole"
mode: single
