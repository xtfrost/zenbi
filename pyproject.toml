[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
]
ignore = [
    "E501",  # Line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402", "E741"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
